<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Arena Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js"></script>
<style>
  img.emoji {
    height: 1em; width: 1em;
    margin: 0 .05em 0 .1em;
    vertical-align: -0.1em;
    display: inline-block;
  }
</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --text: #e8e8f0;
    --muted: #6b7280;
    --success: #10b981;
    --danger: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 140px;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: #0f0f13;
    padding: 18px 16px 14px;
    border-bottom: 1px solid #1e1e2a;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .logo {
    width: 44px; height: 44px;
    background: #18181f;
    border: 1.5px solid #2a2a3d;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    line-height: 1;
  }

  .header-text { display: flex; flex-direction: column; gap: 2px; }

  .header h1 {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0;
    color: #f0f0f5;
    -webkit-text-fill-color: #f0f0f5;
  }

  .header p { font-size: 12px; color: var(--muted); margin-top: 0; }

  /* CATEGORIES */
  .cats {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 2px;
  }
  .cats::-webkit-scrollbar { display: none; }

  .cat-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 16px;
    border-radius: 10px;
    border: 1px solid #1e1e2a;
    background: #18181f;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: all .15s;
    font-family: 'Inter', sans-serif;
  }

  .cat-btn.active {
    background: #fff;
    border-color: #fff;
    color: #0a0a0f;
    font-weight: 600;
  }

  /* SECTION */
  .section { padding: 18px 16px 0; }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ITEM CARD */
  .items { display: flex; flex-direction: column; gap: 10px; }

  .item {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color .2s, transform .1s;
    position: relative;
    overflow: hidden;
  }

  .item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124,58,237,.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .item.in-cart { border-color: var(--accent); }

  .item-emoji {
    font-size: 30px;
    min-width: 42px;
    text-align: center;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }

  .item-info { flex: 1; }

  .item-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }

  .item-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

  .item-price {
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent2);
    margin-top: 5px;
  }

  .item-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 90px;
    justify-content: flex-end;
  }

  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-weight: 700;
    transition: transform .1s, background .1s;
    line-height: 1;
  }

  .qty-btn.minus { background: var(--border); color: var(--text); }
  .qty-btn:active { transform: scale(.9); }

  .qty-display {
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
    color: var(--text);
  }

  .add-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .1s, background .1s;
  }

  .add-btn:active { transform: scale(.9); }

  /* CART BOTTOM */
  .cart-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px 20px;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    z-index: 200;
  }

  .cart-summary {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    display: none;
  }

  .cart-summary.visible { display: flex; }

  .cart-items-text {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  .cart-total {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent2);
    white-space: nowrap;
  }

  .order-btn {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: #fff;
    color: #0a0a0f;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .order-btn:disabled { opacity: .4; cursor: not-allowed; }
  .order-btn:not(:disabled):active { transform: scale(.98); }

  .empty-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .empty-msg .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

  /* HIDDEN categories */
  .cat-section { display: none; }
  .cat-section.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">🎮</div>
    <div class="header-text">
      <h1>FORS GameClub</h1>
      <p>🍔 Ovqat • 🥤 Ichimlik • 🍟 Snack</p>
    </div>
  </div>
  <div class="cats">
    <button class="cat-btn active" data-cat="all">⚡ Hammasi</button>
    <button class="cat-btn" data-cat="food">🍔 Ovqat</button>
    <button class="cat-btn" data-cat="drinks">🥤 Ichimlik</button>
    <button class="cat-btn" data-cat="snacks">🍟 Snack</button>
  </div>
</div>

<div id="menu-content"></div>

<div class="cart-bar">
  <div class="cart-summary" id="cartSummary">
    <div class="cart-items-text" id="cartText">0 ta mahsulot</div>
    <div class="cart-total" id="cartTotal">0 so'm</div>
  </div>
  <button class="order-btn" id="orderBtn" disabled onclick="submitOrder()">
    🛒 Zakaz berish
  </button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const MENU = [
  // OVQAT
  { id:1, cat:'food', emoji:'🍔', name:'Burger',        desc:'Mol go\'shti, sabzavotlar, sous',      price:25000 },
  { id:2, cat:'food', emoji:'🌭', name:'Hot Dog',       desc:'Kolbasa, ketchup, gorchitsa',           price:15000 },
  { id:3, cat:'food', emoji:'🍕', name:'Pizza (1 dona)',desc:'Pepperoni, mozzarella',                 price:20000 },
  { id:4, cat:'food', emoji:'🥪', name:'Sendvich',      desc:'Tovuq, salat, majonez',                 price:18000 },
  { id:5, cat:'food', emoji:'🍜', name:'Lapsha',        desc:'Doshirak, tuxum bilan',                 price:12000 },

  // ICHIMLIK
  { id:6,  cat:'drinks', emoji:'🥤', name:'Cola 0.5L',    desc:'Sovuq, muzli',          price:8000  },
  { id:7,  cat:'drinks', emoji:'🧃', name:'Pepsi 0.5L',   desc:'Sovuq, muzli',          price:8000  },
  { id:8,  cat:'drinks', emoji:'🫧', name:'Sprite 0.5L',  desc:'Sovuq, muzli',          price:8000  },
  { id:9,  cat:'drinks', emoji:'⚡', name:'Energy Drink',  desc:'Red Bull / Monster',    price:15000 },
  { id:10, cat:'drinks', emoji:'☕', name:'Qahva',         desc:'Kapuchino yoki Americano',price:10000},
  { id:11, cat:'drinks', emoji:'🍵', name:'Choy',          desc:'Ko\'k yoki qora',       price:6000  },
  { id:12, cat:'drinks', emoji:'💧', name:'Suv 0.5L',      desc:'Toza ichimlik suvi',    price:4000  },

  // SNACK
  { id:13, cat:'snacks', emoji:'🍟', name:'Kartoshka fri', desc:'Ketchup bilan',         price:12000 },
  { id:14, cat:'snacks', emoji:'🍿', name:'Popcorn',       desc:'Tuzli yoki shirin',     price:10000 },
  { id:15, cat:'snacks', emoji:'🍫', name:'Shokolad',      desc:'Snickers / Twix / KitKat',price:8000},
  { id:16, cat:'snacks', emoji:'🥜', name:'Yong\'oq',      desc:'Tuzlangan aralash',     price:9000  },
  { id:17, cat:'snacks', emoji:'🍪', name:'Печенье',       desc:'Oreo / Digestive',      price:7000  },
];

const cart = {};

function fmt(n) { return n.toLocaleString('uz-UZ') + ' so\'m'; }

function renderMenu(catFilter) {
  const content = document.getElementById('menu-content');
  content.innerHTML = '';

  const cats = catFilter === 'all'
    ? [['food','🍔 Ovqatlar'], ['drinks','🥤 Ichimliklar'], ['snacks','🍟 Snacklar']]
    : [[catFilter, catFilter === 'food' ? '🍔 Ovqatlar' : catFilter === 'drinks' ? '🥤 Ichimliklar' : '🍟 Snacklar']];

  cats.forEach(([cat, label]) => {
    const items = MENU.filter(i => i.cat === cat);
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-title">${label}</div><div class="items" id="cat-${cat}"></div>`;
    content.appendChild(sec);
    const container = sec.querySelector(`#cat-${cat}`);
    items.forEach(item => container.appendChild(makeCard(item)));
  });
}

function makeCard(item) {
  const div = document.createElement('div');
  div.className = 'item' + (cart[item.id] ? ' in-cart' : '');
  div.id = `item-${item.id}`;
  const qty = cart[item.id] || 0;
  div.innerHTML = `
    <div class="item-emoji">${item.emoji}</div>
    <div class="item-info">
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc}</div>
      <div class="item-price">${fmt(item.price)}</div>
    </div>
    <div class="item-controls" id="ctrl-${item.id}">
      ${qty > 0
        ? `<button class="qty-btn minus" onclick="change(${item.id},-1)">−</button>
           <span class="qty-display">${qty}</span>
           <button class="qty-btn" onclick="change(${item.id},1)">+</button>`
        : `<button class="add-btn" onclick="change(${item.id},1)">+</button>`
      }
    </div>`;
  return div;
}

function change(id, delta) {
  const item = MENU.find(i => i.id === id);
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  if (cart[id] === 0) delete cart[id];

  const card = document.getElementById(`item-${id}`);
  if (card) {
    card.className = 'item' + (cart[id] ? ' in-cart' : '');
    const ctrl = document.getElementById(`ctrl-${id}`);
    const qty = cart[id] || 0;
    ctrl.innerHTML = qty > 0
      ? `<button class="qty-btn minus" onclick="change(${id},-1)">−</button>
         <span class="qty-display">${qty}</span>
         <button class="qty-btn" onclick="change(${id},1)">+</button>`
      : `<button class="add-btn" onclick="change(${id},1)">+</button>`;
  }
  updateCartBar();
}

function updateCartBar() {
  const ids = Object.keys(cart);
  const totalQty   = ids.reduce((s, id) => s + cart[id], 0);
  const totalPrice = ids.reduce((s, id) => {
    const item = MENU.find(i => i.id == id);
    return s + item.price * cart[id];
  }, 0);

  const summary = document.getElementById('cartSummary');
  const btn     = document.getElementById('orderBtn');
  const text    = document.getElementById('cartText');
  const total   = document.getElementById('cartTotal');

  if (totalQty > 0) {
    summary.classList.add('visible');
    const names = ids.map(id => {
      const item = MENU.find(i => i.id == id);
      return `${item.emoji} ${item.name} x${cart[id]}`;
    }).join(', ');
    text.textContent = names;
    total.textContent = fmt(totalPrice);
    btn.disabled = false;
    btn.textContent = `🛒 Zakaz berish (${fmt(totalPrice)})`;
  } else {
    summary.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = '🛒 Zakaz berish';
  }
}

function submitOrder() {
  const ids = Object.keys(cart);
  if (!ids.length) return;

  const items = ids.map(id => {
    const item = MENU.find(i => i.id == id);
    return { name: item.name, emoji: item.emoji, qty: cart[id], price: item.price };
  });

  const totalPrice = items.reduce((s, i) => s + i.price * i.qty, 0);

  const data = JSON.stringify({ items, totalPrice });
  tg.sendData(data);
}

// Category filter
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(btn.dataset.cat);
  });
});

// Init
renderMenu('all');

// Twemoji — barcha emoji ni Apple uslubiga o'tkazish
function applyTwemoji() {
  twemoji.parse(document.body, {
    folder: 'svg',
    ext: '.svg',
    base: 'https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/'
  });
}

applyTwemoji();

// Har yangi render dan keyin ham qo'llash
const _origRender = renderMenu;
window.renderMenu = function(cat) {
  _origRender(cat);
  setTimeout(applyTwemoji, 50);
};
</script>
</body>
</html>
